<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión · M-Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#12211F; color:#EEF2F0; font-family:'Inter',sans-serif; text-align:center; padding:24px;
  }
  .caja{ max-width:340px; }
  h1{ font-family:'Fraunces',serif; font-size:1.4rem; margin-bottom:8px; }
  p{ color:#B7C7C3; font-size:.9rem; line-height:1.5; }
  button{
    margin-top:18px; background:#0F6E5C; color:#fff; border:none; border-radius:8px;
    padding:10px 20px; font-weight:600; font-size:.9rem; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>Sin conexión</h1>
    <p>No se pudo cargar esta página porque no hay internet en este momento. Revisa tu conexión e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
